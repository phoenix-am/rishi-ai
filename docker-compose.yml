services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rishi-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rishi_ai
      TZ: UTC
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - rishi_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rishi_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rishi_network

volumes:
  rishi_postgres_data:
    name: rishi_postgres_data

networks:
  rishi_network:
    name: rishi_network
